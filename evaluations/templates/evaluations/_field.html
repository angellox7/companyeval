<div class="field{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    {{ field }}
    {{ field.label_tag }}
  {% else %}
    {{ field.label_tag }}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}
    <p class="error">{{ error }}</p>
  {% endfor %}
</div>
